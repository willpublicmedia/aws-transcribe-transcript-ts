name: Create Release

# Trigger the workflow when a new tag is pushed (e.g., v1.0.0)
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{secrets.GH_PACKAGE_INSTALL_TOKEN}}
      VERSION: ${{github.ref_name}}
    permissions:
      contents: write # Required to create releases and upload assets
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup
        uses: actions/setup-node@v6
        with:
          node-version: "latest"
          registry-url: "https://npm.pkg.github.com"
      - run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGE_INSTALL_TOKEN }}" >> .npmrc
          echo "@willpublicmedia:registry=https://npm.pkg.github.com" >> .npmrc
      - name: install
        run: npm ci
      - name: build
        run: npm run build
      - name: test
        run: npm test
      - name: publish prerelease
        if: ${{contains(github.ref_name, '-')}}
        run: npm publish --tag=prerelease
      - name: publish release
        if: ${{!contains(github.ref_name, '-')}}
        run: npm publish
